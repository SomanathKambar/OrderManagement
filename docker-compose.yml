version: '3.8'
services:
  postgres:
    image: postgres:17-alpine
    container_name: oms_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ordermanagement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: oms_redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: oms_mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MH_STORAGE: memory

volumes:
  postgres_data:
